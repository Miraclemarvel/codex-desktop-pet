name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:host
      - name: Check CLI process discovery
        shell: powershell
        run: ./tests/cli-host.test.ps1

  rust:
    name: Rust single EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Select stable Rust MSVC toolchain
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test Rust single EXE
        shell: powershell
        run: ./scripts/build-rust.ps1
      - name: Upload Rust release files
        uses: actions/upload-artifact@v7
        with:
          name: rust-windows-x64
          path: |
            outputs/CodexPet-Rust-Windows-x64-v*.exe
            outputs/CodexPet-Rust-Windows-x64-v*.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
