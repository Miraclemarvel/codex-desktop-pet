[package]
name = "codex-pet-rust"
version = "0.5.0-preview.8"
edition = "2021"
description = "Native Windows single executable Codex white dragon companion"
publish = false

[[bin]]
name = "CodexPetRust"
path = "codex_pet.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image-webp = "0.2.4"
miniz_oxide = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_Time", "Win32_System_RemoteDesktop",
  "Win32_Security", "Win32_Storage_FileSystem"
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
